/inventory:
    get:
        summary: Get inventory of current cinema
        description: | Permisos necesarios: 'CRUD:READ:INVENTORY'
            Returns the stock and product information for the authenticated user's cinema.
            The cinema ID is extracted from the JWT token.
            Permisos necesarios: "CRUD:READ:INVENTORY"
        tags:
            - Inventory
        security:
            - bearerAuth: []
        parameters:
            - name: page
              in: query
              schema:
                  type: integer
              description: Page number
            - name: limit
              in: query
              schema:
                  type: integer
              description: Items per page
            - name: product_id
              in: query
              schema:
                  type: integer
              description: Filter by product ID
        responses:
            '200':
                description: Inventory list
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                    example: true
                                message:
                                    type: string
                                    example: Inventario obtenido exitosamente
                                data:
                                    type: array
                                    items:
                                        type: object
                                        properties:
                                            id:
                                                type: integer
                                            product:
                                                type: object
                                                properties:
                                                    id:
                                                        type: integer
                                                    name:
                                                        type: string
                                                    sku:
                                                        type: string
                                                    product_category:
                                                        type: object
                                            stock:
                                                type: integer
                                            minimum_stock:
                                                type: integer
                                            current_unit_cost_base_currency:
                                                type: number
            '401':
                description: Unauthorized
            '403':
                description: Insufficient permissions

/inventory/products/{productId}:
    get:
        summary: Get product stock in current cinema
        tags:
            - Inventory
        security:
            - bearerAuth: []
        parameters:
            - name: productId
              in: path
              required: true
              schema:
                  type: integer
        responses:
            '200':
                description: Product stock details Permisos necesarios: 'CRUD:READ:INVENTORY'
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                message:
                                    type: string
                                data:
                                    type: object
                                    properties:
                                        id:
                                            type: integer
                                        product:
                                            type: object
                                        stock:
                                            type: integer
                                        minimum_stock:
                                            type: integer
                                        current_unit_cost_base_currency:
                                            type: number
            '404':
                description: Product not provisioned in this cinema
    post:
        summary: Provision product in current cinema
        description: | Permisos necesarios: 'CRUD:CREATE:INVENTORY_MOVEMENT'
            Creates an inventory record for a product in the current cinema.
            Stock starts at 0. Minimum stock can be specified.
            Permisos necesarios: "CRUD:CREATE:INVENTORY_MOVEMENT"
        tags:
            - Inventory
        security:
            - bearerAuth: []
        parameters:
            - name: productId
              in: path
              required: true
              schema:
                  type: integer
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            minimumStock:
                                type: integer
                                default: 0
                                example: 5
        responses:
            '201':
                description: Product provisioned
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                message:
                                    type: string
                                data:
                                    type: object
            '401':
                description: Unauthorized
            '403':
                description: Insufficient permissions
            '409':
                description: Product already provisioned

/inventory/{id}:
    get:
        summary: Get inventory record details with movements
        tags:
            - Inventory
        security:
            - bearerAuth: []
        parameters:
            - name: id
              in: path
              required: true
              schema:
                  type: integer
        responses:
            '200':
                description: Inventory detail with movement history Permisos necesarios: 'CRUD:READ:INVENTORY'
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                message:
                                    type: string
                                data:
                                    type: object
                                    properties:
                                        id:
                                            type: integer
                                        product:
                                            type: object
                                        stock:
                                            type: integer
                                        minimum_stock:
                                            type: integer
                                        current_unit_cost_base_currency:
                                            type: number
                                        movements:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    id:
                                                        type: integer
                                                    operation_type:
                                                        type: integer
                                                    quantity:
                                                        type: integer
                                                    unit_cost:
                                                        type: number
                                                    remarks:
                                                        type: string
                                                    created_at:
                                                        type: string
                                                        format: date-time
            '404':
                description: Inventory record not found

/inventory/{id}/movements:
    post:
        summary: Register inventory movements
        description: | Permisos necesarios: 'CRUD:CREATE:INVENTORY_MOVEMENT'
            Register one or more movements (entry, exit, manual adjustment) for an inventory record.
            Each movement can specify `operationType`, `quantity`, optional `unit_cost` (for entries),
            and `adjustmentDirection` to force increase/decrease.
            Permisos necesarios: "CRUD:CREATE:INVENTORY_MOVEMENT"
        tags:
            - Inventory
        security:
            - bearerAuth: []
        parameters:
            - name: id
              in: path
              required: true
              schema:
                  type: integer
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: array
                        items:
                            type: object
                            required:
                                - operationType
                                - quantity
                            properties:
                                operationType:
                                    type: integer
                                    description: ID of operation type (e.g., 3=entry, 4=exit)
                                quantity:
                                    type: integer
                                    minimum: 1
                                unit_cost:
                                    type: number
                                    description: Required for entry movements if cost differs from average
                                remarks:
                                    type: string
                                adjustmentDirection:
                                    type: string
                                    enum: [increase, decrease]
                                    description: Overrides the default sign of the operation
        responses:
            '201':
                description: Movements registered
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                message:
                                    type: string
                                data:
                                    type: array
                                    items:
                                        type: object
            '400':
                description: Validation error (negative stock, missing fields)
            '401':
                description: Unauthorized
            '403':
                description: Insufficient permissions
            '404':
                description: Inventory record not found
