/reports/cashier:
    get:
        summary: Reporte de caja
        description: |
            Permisos necesarios: 'CRUD:READ:REPORTS-CASHIER'
            Reporte de caja de un empleado.
            - Empleado: usa su propio employeeId y cinemaId del JWT.
            - Superadmin: debe enviar ?cinemaId y ?employeeId.
        tags:
            - Reports
        security:
            - bearerAuth: []
        parameters:
            - in: query
              name: from
              schema:
                  type: string
                  format: date
            - in: query
              name: to
              schema:
                  type: string
                  format: date
            - in: query
              name: cinemaId
              schema:
                  type: integer
              description: ID de sucursal (requerido para superadmin)
            - in: query
              name: employeeId
              schema:
                  type: integer
              description: ID del empleado (requerido para superadmin)
        responses:
            '200':
                description: Reporte generado
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                message:
                                    type: string
                                data:
                                    type: object
                                    properties:
                                        period:
                                            type: object
                                            properties:
                                                from:
                                                    type: string
                                                    format: date
                                                to:
                                                    type: string
                                                    format: date
                                        employee_id:
                                            type: integer
                                        summary:
                                            type: object
                                            properties:
                                                total_orders:
                                                    type: integer
                                                total_revenue:
                                                    type: number
                                                total_tax:
                                                    type: number
                                                cancelled_orders:
                                                    type: integer
                                        breakdown_by_payment_method:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    payment_method:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: integer
                                                            description:
                                                                type: string
                                                    total_amount:
                                                        type: number
                                                    transaction_count:
                                                        type: integer
                                        transactions:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    order_id:
                                                        type: integer
                                                    created_at:
                                                        type: string
                                                        format: date-time
                                                    status:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: integer
                                                            description:
                                                                type: string
                                                    total:
                                                        type: number
                                                    payments:
                                                        type: array
                                                        items:
                                                            type: object
                                                            properties:
                                                                method:
                                                                    type: object
                                                                    properties:
                                                                        id:
                                                                            type: integer
                                                                        description:
                                                                            type: string
                                                                amount:
                                                                    type: number
                                                                reference:
                                                                    type: string
                                                                    nullable: true
            '401':
                description: No autorizado
            '403':
                description: Permisos insuficientes
