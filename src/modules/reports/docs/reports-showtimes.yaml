/reports/showtimes:
    get:
        summary: Reporte de funciones
        description: |
            Ocupación e ingresos por función.
            - Empleado: cinemaId del JWT.
            - Superadmin: ?cinemaId opcional.
            Permiso: **CRUD:READ:REPORTS-SHOWTIMES**
        tags:
            - Reports
        security:
            - bearerAuth: []
        parameters:
            - in: query
              name: from
              schema:
                  type: string
                  format: date
            - in: query
              name: to
              schema:
                  type: string
                  format: date
            - in: query
              name: cinemaId
              schema:
                  type: integer
              description: ID de sucursal (opcional, solo superadmin)
        responses:
            '200':
                description: Reporte generado
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                message:
                                    type: string
                                data:
                                    type: object
                                    properties:
                                        period:
                                            type: object
                                            properties:
                                                from:
                                                    type: string
                                                    format: date
                                                to:
                                                    type: string
                                                    format: date
                                        showtimes:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    showtime_id:
                                                        type: integer
                                                    booking_id:
                                                        type: integer
                                                    start_time:
                                                        type: string
                                                        format: date-time
                                                    end_time:
                                                        type: string
                                                        format: date-time
                                                    content:
                                                        type: object
                                                        properties:
                                                            type:
                                                                type: string
                                                                enum: [movie, event]
                                                            id:
                                                                type: integer
                                                            title:
                                                                type: string
                                                    room:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: integer
                                                            name:
                                                                type: string
                                                    capacity:
                                                        type: integer
                                                    tickets_sold:
                                                        type: integer
                                                    occupancy_pct:
                                                        type: number
                                                    revenue:
                                                        type: number
            '401':
                description: No autorizado
            '403':
                description: Permisos insuficientes
