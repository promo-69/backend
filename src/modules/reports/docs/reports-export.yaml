              schema:
                  type: integer
            - in: query
              name: format
              schema:
                  type: string
                  enum: [json, csv, xlsx, pdf]
                  default: json
            - in: query
              name: from
              schema:
                  type: string
                  format: date
            - in: query
              name: to
              schema:
                  type: string
                  format: date
        responses:
            '200':
                description: Exported file
                content:
                    application/json:
                        schema:
                            type: object
                    text/csv: {}
                    application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
                    application/pdf: {}
            '401':
                description: Unauthorized
            '403':
                description: Insufficient permissions
