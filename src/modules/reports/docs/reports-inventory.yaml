/reports/inventory:
    get:
        summary: Reporte de inventario
        description: |
            Permisos necesarios: 'CRUD:READ:REPORTS-INVENTORY'
            Stock actual, unidades vendidas, recibidas, valorización y alertas de stock bajo.
            - Empleado: cinemaId del JWT.
            - Superadmin: ?cinemaId opcional.
        tags:
            - Reports
        security:
            - bearerAuth: []
        parameters:
            - in: query
              name: from
              schema:
                  type: string
                  format: date
            - in: query
              name: to
              schema:
                  type: string
                  format: date
            - in: query
              name: cinemaId
              schema:
                  type: integer
              description: ID de sucursal (opcional, solo superadmin)
        responses:
            '200':
                description: Reporte generado
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                message:
                                    type: string
                                data:
                                    type: object
                                    properties:
                                        period:
                                            type: object
                                            properties:
                                                from:
                                                    type: string
                                                    format: date
                                                to:
                                                    type: string
                                                    format: date
                                        products:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    inventory_id:
                                                        type: integer
                                                    product:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: integer
                                                            name:
                                                                type: string
                                                            sku:
                                                                type: string
                                                            category:
                                                                type: object
                                                            selling_price:
                                                                type: number
                                                            currency_id:
                                                                type: integer
                                                    current_stock:
                                                        type: integer
                                                    minimum_stock:
                                                        type: integer
                                                    units_sold:
                                                        type: integer
                                                    units_received:
                                                        type: integer
                                                    stock_value:
                                                        type: number
                                                    below_minimum:
                                                        type: boolean
                                        alerts:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    product:
                                                        type: object
                                                    current_stock:
                                                        type: integer
                                                    minimum_stock:
                                                        type: integer
            '401':
                description: No autorizado
            '403':
                description: Permisos insuficientes
