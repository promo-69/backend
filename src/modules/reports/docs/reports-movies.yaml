/reports/movies:
    get:
        summary: Reporte de películas
        description: |
            Estadísticas de películas (funciones, boletos, ingresos, ocupación).
            - Empleado: cinemaId del JWT.
            - Superadmin: ?cinemaId opcional.
            Permiso: **CRUD:READ:REPORTS-MOVIES**
        tags:
            - Reports
        security:
            - bearerAuth: []
        parameters:
            - in: query
              name: from
              schema:
                  type: string
                  format: date
            - in: query
              name: to
              schema:
                  type: string
                  format: date
            - in: query
              name: cinemaId
              schema:
                  type: integer
              description: ID de sucursal (opcional, solo superadmin)
        responses:
            '200':
                description: Reporte generado
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                message:
                                    type: string
                                data:
                                    type: object
                                    properties:
                                        period:
                                            type: object
                                            properties:
                                                from:
                                                    type: string
                                                    format: date
                                                to:
                                                    type: string
                                                    format: date
                                        movies:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    movie:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: integer
                                                            title:
                                                                type: string
                                                            poster_url:
                                                                type: string
                                                                nullable: true
                                                    total_showtimes:
                                                        type: integer
                                                    total_tickets_sold:
                                                        type: integer
                                                    total_revenue:
                                                        type: number
                                                    avg_occupancy_pct:
                                                        type: number
            '401':
                description: No autorizado
            '403':
                description: Permisos insuficientes
