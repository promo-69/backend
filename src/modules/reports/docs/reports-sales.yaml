/reports/sales:
    get:
        summary: Reporte de ventas
        description: |
            Reporte consolidado de ventas.
            - Empleado: cinemaId del JWT.
            - Superadmin: ?cinemaId opcional (global si se omite).
            Permiso: **CRUD:READ:REPORTS-SALES**
        tags:
            - Reports
        security:
            - bearerAuth: []
        parameters:
            - in: query
              name: from
              schema:
                  type: string
                  format: date
            - in: query
              name: to
              schema:
                  type: string
                  format: date
            - in: query
              name: channel
              schema:
                  type: string
                  enum: [all, taquilla, web, app]
                  default: all
            - in: query
              name: cinemaId
              schema:
                  type: integer
              description: ID de sucursal (opcional, solo superadmin)
        responses:
            '200':
                description: Reporte generado
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                message:
                                    type: string
                                data:
                                    type: object
                                    properties:
                                        period:
                                            type: object
                                            properties:
                                                from:
                                                    type: string
                                                    format: date
                                                to:
                                                    type: string
                                                    format: date
                                        channel:
                                            type: string
                                        summary:
                                            type: object
                                            properties:
                                                total_orders:
                                                    type: integer
                                                total_tickets:
                                                    type: integer
                                                total_revenue:
                                                    type: number
                                                total_tax:
                                                    type: number
                                                total_concessions_revenue:
                                                    type: number
                                                total_loyalty_points_generated:
                                                    type: integer
                                                net_revenue:
                                                    type: number
                                        breakdown_by_payment_method:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    payment_method:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: integer
                                                            description:
                                                                type: string
                                                    total_amount:
                                                        type: number
                                                    transaction_count:
                                                        type: integer
                                        daily_series:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    date:
                                                        type: string
                                                        format: date
                                                    orders:
                                                        type: integer
                                                    tickets:
                                                        type: integer
                                                    revenue:
                                                        type: number
                                                    loyalty_points:
                                                        type: integer
                                        product_breakdown:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    product_id:
                                                        type: integer
                                                    product_name:
                                                        type: string
                                                    type:
                                                        type: string
                                                        enum: [product, combo]
                                                    quantity_sold:
                                                        type: integer
                                                    total_revenue:
                                                        type: number
            '401':
                description: No autorizado
            '403':
                description: Permisos insuficientes
