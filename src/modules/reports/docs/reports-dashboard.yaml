/reports/dashboard:
    get:
        summary: Obtener dashboard consolidado
        description: |
            Permisos necesarios: 'CRUD:READ:REPORTS-DASHBOARD'
            Retorna KPIs, top películas/eventos, stock bajo, desglose de pagos y serie temporal.
            - Empleado: cinemaId del JWT (no enviar ?cinemaId).
            - Superadmin: ?cinemaId opcional para filtrar por sede; si se omite, vista global.
        tags:
            - Reports Dashboard
        security:
            - bearerAuth: []
        parameters:
            - in: query
              name: from
              schema:
                  type: string
                  format: date
              description: Fecha inicio (YYYY-MM-DD)
            - in: query
              name: to
              schema:
                  type: string
                  format: date
              description: Fecha fin (YYYY-MM-DD)
            - in: query
              name: cinemaId
              schema:
                  type: integer
              description: ID de sucursal (opcional, solo superadmin)
        responses:
            '200':
                description: Dashboard generado exitosamente
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                    example: true
                                message:
                                    type: string
                                    example: Dashboard generado exitosamente
                                data:
                                    type: object
                                    properties:
                                        period:
                                            type: object
                                            properties:
                                                from:
                                                    type: string
                                                    format: date
                                                to:
                                                    type: string
                                                    format: date
                                        scope:
                                            type: object
                                            properties:
                                                type:
                                                    type: string
                                                    enum: [global, cinema]
                                                cinemaId:
                                                    type: integer
                                        kpis:
                                            type: object
                                            properties:
                                                total_revenue:
                                                    type: number
                                                total_orders:
                                                    type: integer
                                                total_tickets:
                                                    type: integer
                                                net_revenue:
                                                    type: number
                                                total_concessions_revenue:
                                                    type: number
                                                total_loyalty_points:
                                                    type: integer
                                                avg_occupancy_pct:
                                                    type: number
                                                active_rentals:
                                                    type: integer
                                                low_stock_alerts:
                                                    type: integer
                                        daily_series:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    date:
                                                        type: string
                                                        format: date
                                                    orders:
                                                        type: integer
                                                    tickets:
                                                        type: integer
                                                    revenue:
                                                        type: number
                                                    loyalty_points:
                                                        type: integer
                                        payment_breakdown:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    payment_method:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: integer
                                                            description:
                                                                type: string
                                                    total_amount:
                                                        type: number
                                                    transaction_count:
                                                        type: integer
                                        top_movies:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    id:
                                                        type: integer
                                                    title:
                                                        type: string
                                                    total_tickets_sold:
                                                        type: integer
                                                    total_revenue:
                                                        type: number
                                                    avg_occupancy_pct:
                                                        type: number
                                        top_events:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    id:
                                                        type: integer
                                                    title:
                                                        type: string
                                                    total_tickets_sold:
                                                        type: integer
                                                    total_revenue:
                                                        type: number
                                        low_stock_products:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    id:
                                                        type: integer
                                                    name:
                                                        type: string
                                                    current_stock:
                                                        type: integer
                                                    minimum_stock:
                                                        type: integer
            '401':
                description: No autorizado
            '403':
                description: Permisos insuficientes
