/reports/{reportType}/chart:
    get:
        summary: Get chart data for a report type (employee)
        description: |
            Returns normalized data for Recharts/Chart.js.
            Available report types: sales, movies, events, inventory, showtimes, rentals.
            Required permission: **CRUD:READ:REPORTS-CHARTS**
        tags:
            - Reports Charts
        security:
            - bearerAuth: []
        parameters:
            - in: path
              name: reportType
              required: true
              schema:
                  type: string
                  enum: [sales, movies, events, inventory, showtimes, rentals]
            - in: query
              name: from
              schema:
                  type: string
                  format: date
            - in: query
              name: to
              schema:
                  type: string
                  format: date
            - in: query
              name: groupBy
              schema:
                  type: string
                  enum: [day, week, month]
                  default: day
              description: Only applies to sales chart
            - in: query
              name: channel
              schema:
                  type: string
                  enum: [all, taquilla, web, app]
              description: Only applies to sales chart
        responses:
            '200':
                description: Chart data
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                message:
                                    type: string
                                data:
                                    type: object
                                    properties:
                                        type:
                                            type: string
                                            enum: [bar, line, pie, area]
                                        period:
                                            type: object
                                            properties:
                                                from:
                                                    type: string
                                                    format: date
                                                to:
                                                    type: string
                                                    format: date
                                        groupBy:
                                            type: string
                                            enum: [day, week, month]
                                        datasets:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    label:
                                                        type: string
                                                    key:
                                                        type: string
                                                    data:
                                                        type: array
                                                        items:
                                                            type: object
                                                            properties:
                                                                label:
                                                                    type: string
                                                                value:
                                                                    type: number
            '401':
                description: Unauthorized
            '403':
                description: Insufficient permissions

