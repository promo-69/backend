/reports/rentals:
    get:
        summary: Reporte de alquileres
        description: |
            Permisos necesarios: 'CRUD:READ:REPORTS-RENTALS'
            Solicitudes de alquiler, estado, ingresos confirmados y proyectados.
            - Empleado: cinemaId del JWT.
            - Superadmin: ?cinemaId opcional.
        tags:
            - Reports
        security:
            - bearerAuth: []
        parameters:
            - in: query
              name: from
              schema:
                  type: string
                  format: date
            - in: query
              name: to
              schema:
                  type: string
                  format: date
            - in: query
              name: cinemaId
              schema:
                  type: integer
              description: ID de sucursal (opcional, solo superadmin)
        responses:
            '200':
                description: Reporte generado
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                success:
                                    type: boolean
                                message:
                                    type: string
                                data:
                                    type: object
                                    properties:
                                        period:
                                            type: object
                                            properties:
                                                from:
                                                    type: string
                                                    format: date
                                                to:
                                                    type: string
                                                    format: date
                                        summary:
                                            type: object
                                            properties:
                                                total_requests:
                                                    type: integer
                                                pending_review:
                                                    type: integer
                                                confirmed_revenue:
                                                    type: number
                                                projected_revenue:
                                                    type: number
                                        breakdown_by_status:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    status:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: integer
                                                            description:
                                                                type: string
                                                    count:
                                                        type: integer
                                                    revenue:
                                                        type: number
                                        requests:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    id:
                                                        type: integer
                                                    event_name:
                                                        type: string
                                                    event_date:
                                                        type: string
                                                        format: date
                                                    requested_start_time:
                                                        type: string
                                                        format: date-time
                                                    requested_end_time:
                                                        type: string
                                                        format: date-time
                                                    room:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: integer
                                                            name:
                                                                type: string
                                                    status:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: integer
                                                            description:
                                                                type: string
                                                    price:
                                                        type: number
                                                        nullable: true
                                                    currency:
                                                        type: object
                                                        nullable: true
                                                        properties:
                                                            id:
                                                                type: integer
                                                            code:
                                                                type: string
                                                            symbol:
                                                                type: string
            '401':
                description: No autorizado
            '403':
                description: Permisos insuficientes
