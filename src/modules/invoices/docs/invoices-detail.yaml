/invoices/{id}:
  get:
    summary: Obtener detalle de factura
    description: |
      Obtiene el detalle completo de una factura incluyendo líneas, pagos, impuestos y QR.

      **Permiso:** CRUD:READ:INVOICES
    tags:
      - Invoices
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID de la factura
    responses:
      '200':
        description: Detalle de la factura
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                    invoice_number:
                      type: string
                    billing_name:
                      type: string
                    billing_document:
                      type: string
                    billing_address:
                      type: string
                      nullable: true
                    issued_at:
                      type: string
                      format: date-time
                    is_voided:
                      type: boolean
                    voided_reason:
                      type: string
                      nullable: true
                    voided_by:
                      type: object
                      nullable: true
                    cinema:
                      type: object
                    employee:
                      type: object
                      nullable: true
                    customer:
                      type: object
                      nullable: true
                    order:
                      type: object
                    lines:
                      type: array
                      items:
                        type: object
                    payments:
                      type: array
                      items:
                        type: object
                    taxes:
                      type: array
                      items:
                        type: object
      '401':
        description: No autorizado
      '403':
        description: Permisos insuficientes
      '404':
        description: Factura no encontrada
