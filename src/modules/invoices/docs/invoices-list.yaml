/invoices:
  get:
    summary: Listar facturas
    description: |
      Listado de facturas con filtros opcionales.

      **Filtros:**
      - `cinemaId`: Filtrar por sucursal (solo superadmin)
      - `employeeId`: Filtrar por empleado
      - `from`: Fecha inicio (YYYY-MM-DD)
      - `to`: Fecha fin (YYYY-MM-DD)
      - `search`: Búsqueda por número, nombre o documento
      - `voided`: `true` (solo anuladas) | `false` (solo activas) | omitir (todas)
      - `page`: Número de página (default: 1)
      - `limit`: Registros por página (default: 20)

      **Permiso:** CRUD:READ:INVOICES
    tags:
      - Invoices
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: cinemaId
        schema:
          type: integer
        description: ID de sucursal (opcional, solo superadmin)
      - in: query
        name: employeeId
        schema:
          type: integer
        description: ID de empleado (opcional)
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Fecha inicio (YYYY-MM-DD)
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Fecha fin (YYYY-MM-DD)
      - in: query
        name: search
        schema:
          type: string
        description: Búsqueda por número, nombre o documento
      - in: query
        name: voided
        schema:
          type: boolean
        description: |
          - `true` → solo facturas anuladas
          - `false` → solo facturas activas
          - omitir → todas las facturas
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Número de página
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
        description: Registros por página
    responses:
      '200':
        description: Listado de facturas
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Facturas obtenidas exitosamente
                data:
                  type: object
                  properties:
                    invoices:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          invoice_number:
                            type: string
                          billing_name:
                            type: string
                          billing_document:
                            type: string
                          issued_at:
                            type: string
                            format: date-time
                          is_voided:
                            type: boolean
                          voided_reason:
                            type: string
                            nullable: true
                          order:
                            type: object
                            properties:
                              id:
                                type: integer
                              total:
                                type: number
                              currency:
                                type: object
                              status:
                                type: object
                              cinema:
                                type: object
                              employee:
                                type: object
                                nullable: true
                    pagination:
                      type: object
                      properties:
                        page:
                          type: integer
                        limit:
                          type: integer
                        total:
                          type: integer
      '401':
        description: No autorizado
      '403':
        description: Permisos insuficientes
