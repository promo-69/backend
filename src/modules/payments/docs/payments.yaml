openapi: 3.0.0
info:
  title: Payments Module
  version: 1.0.0
paths:
  /payments/options:
    get:
      summary: Obtener opciones de pago combinadas
      description: Devuelve una lista combinada de opciones de pago, incluyendo bancos, monedas y métodos de pago.
      tags:
        - Payments
      responses:
        '200':
          description: Opciones de pago devueltas exitosamente.
  /payments/bank-accounts:
    get:
      summary: Listar cuentas bancarias
      description: Devuelve una lista de cuentas bancarias. Permisos necesarios: "CRUD:READ:PAYMENTS_MODULE"
      tags:
        - Bank Accounts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cuentas listadas.
    post:
      summary: Crear una nueva cuenta bancaria
      description: Crea una nueva cuenta bancaria. Permisos necesarios: "CRUD:CREATE:PAYMENTS_MODULE"
      tags:
        - Bank Accounts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bank
                - currency
                - payment_method
                - payment_details
              properties:
                bank:
                  type: integer
                currency:
                  type: integer
                payment_method:
                  type: integer
                payment_details:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      value:
                        type: string
      responses:
        '201':
          description: Cuenta creada.
  /payments/bank-accounts/{id}:
    get:
      summary: Obtener una cuenta bancaria
      description: Devuelve los detalles de una cuenta bancaria específica. Permisos necesarios: "CRUD:READ:PAYMENTS_MODULE"
      tags:
        - Bank Accounts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datos de la cuenta bancaria devueltos exitosamente.
    patch:
      summary: Actualizar una cuenta bancaria
      description: Actualiza los detalles de una cuenta bancaria específica. Permisos necesarios: "CRUD:UPDATE:PAYMENTS_MODULE"
      tags:
        - Bank Accounts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bank:
                  type: integer
                currency:
                  type: integer
                payment_method:
                  type: integer
                payment_details:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      value:
                        type: string
      responses:
        '200':
          description: Cuenta actualizada.
    delete:
      summary: Eliminar una cuenta bancaria
      description: Elimina una cuenta bancaria específica. Permisos necesarios: "CRUD:DELETE:PAYMENTS_MODULE"
      tags:
        - Bank Accounts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cuenta eliminada.
