openapi: 3.0.0
info:
  title: Payments Module
  version: 1.0.0
paths:
  /payments/options:
    get:
      summary: Obtener opciones de pago combinadas
      tags:
        - Payments
      responses:
        '200':
          description: Opciones de pago devueltas exitosamente.
  /payments/bank-accounts:
    get:
      summary: Listar cuentas bancarias
      tags:
        - Bank Accounts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cuentas listadas.
    post:
      summary: Crear una nueva cuenta bancaria
      tags:
        - Bank Accounts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bank
                - currency
                - payment_method
                - payment_details
              properties:
                bank:
                  type: integer
                currency:
                  type: integer
                payment_method:
                  type: integer
                payment_details:
                  type: object
      responses:
        '201':
          description: Cuenta creada.
  /payments/bank-accounts/{id}:
    patch:
      summary: Actualizar una cuenta bancaria
      tags:
        - Bank Accounts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bank:
                  type: integer
                currency:
                  type: integer
                payment_method:
                  type: integer
                payment_details:
                  type: object
      responses:
        '200':
          description: Cuenta actualizada.
    delete:
      summary: Eliminar una cuenta bancaria
      tags:
        - Bank Accounts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cuenta eliminada.
